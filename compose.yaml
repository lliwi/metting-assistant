# Metting Agent — despliegue autocontenido.
#
#   Base (producción inicial):  docker compose up -d
#   Desarrollo:                 docker compose -f compose.yaml -f infra/compose/dev.yaml up
#   Telemetría:                 añadir --profile observability
#
# Solo nginx publica puertos. Postgres, Redis, Garage y el worker viven en la red interna.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

x-stateful: &stateful
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://metting:${POSTGRES_PASSWORD:?}@postgres:5432/metting
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  S3_ENDPOINT: http://garage:3900
  S3_BUCKET: ${S3_BUCKET:-recordings}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY_HEADERS: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  EMAIL_FROM: ${EMAIL_FROM:-Metting Agent <no-reply@metting.local>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
  # Sin antivirus disponible, las importaciones se rechazan (scan_unavailable).
  ANTIVIRUS_MODE: ${ANTIVIRUS_MODE:-clamd}
  CLAMD_HOST: clamav
  SCRATCH_DIR: /scratch
  ASR_PROVIDER: ${ASR_PROVIDER:-faster_whisper}
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  WHISPER_MODELS_DIR: /models
  # Caché de Hugging Face en el volumen de modelos (el resto del sistema es de solo lectura).
  HF_HOME: /models/huggingface
  # matplotlib y fontconfig (dependencias de pyannote y WeasyPrint) necesitan una caché escribible.
  MPLCONFIGDIR: /tmp/matplotlib
  XDG_CACHE_HOME: /tmp/cache
  DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-none}
  OPENAI_DIARIZE_MODEL: ${OPENAI_DIARIZE_MODEL:-gpt-4o-transcribe-diarize}
  PYANNOTE_MODEL: ${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
  HF_TOKEN: ${HF_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  AI_AUTO_GENERATE: ${AI_AUTO_GENERATE:-false}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
  OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-}

services:
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.2-alpine
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    tmpfs: ["/tmp", "/var/cache/nginx"]
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  web:
    <<: *hardening
    build:
      context: ./apps/web
    image: metting-agent/web:${IMAGE_TAG:-dev}
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  api:
    <<: *hardening
    build:
      context: ./apps/api
      target: api
    image: metting-agent/api:${IMAGE_TAG:-dev}
    environment:
      <<: *api-env
      ROOT_PATH: /api
    networks: [edge, internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  # Job controlado: las migraciones terminan antes de que arranque la API.
  migrate:
    <<: *hardening
    image: metting-agent/api:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    networks: [internal]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *hardening
    build:
      context: ./apps/api
      target: worker
    image: metting-agent/worker:${IMAGE_TAG:-dev}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "default,media,llm,exports", "-n", "worker@%h"]
    environment: *api-env
    # egress: salida a proveedores externos de ASR/LLM; sin puertos publicados.
    networks: [internal, egress]
    # Disco de trabajo para unir y convertir archivos importados (pueden ocupar GB).
    volumes:
      - worker_scratch:/scratch
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  # Tareas periódicas (celery beat): reencola trabajos perdidos cada 10 min. Una sola réplica.
  scheduler:
    <<: *hardening
    image: metting-agent/worker:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *api-env
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }

  # Transcripción: separado porque Whisper satura la CPU (o la GPU). Escala por su cuenta.
  worker-asr:
    <<: *hardening
    image: metting-agent/worker:${IMAGE_TAG:-dev}
    pull_policy: never
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "asr", "-n", "asr@%h"]
    environment: *api-env
    # egress: descarga de modelos Whisper y APIs externas (Ollama, OpenAI).
    networks: [internal, egress]
    volumes:
      - worker_scratch:/scratch
      - whisper_models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d asr@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "8", memory: 6G }

  postgres:
    <<: *stateful
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: metting
      POSTGRES_USER: metting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metting -d metting"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  redis:
    <<: *stateful
    image: redis:7.4.11-alpine3.21
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      # redis-cli lee la contraseña de aquí; así no aparece en la línea de comandos.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  garage:
    <<: *stateful
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-recordings}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  # Antivirus de archivos importados. Activar en producción con COMPOSE_PROFILES=antivirus.
  # Necesita ~2 GB de RAM y descarga firmas al arrancar (varios minutos la primera vez).
  clamav:
    <<: *stateful
    profiles: [antivirus]
    image: clamav/clamav:1.5.4
    volumes:
      - clamav_db:/var/lib/clamav
    # egress: freshclam actualiza las firmas.
    networks: [internal, egress]
    deploy:
      resources:
        limits: { cpus: "1", memory: 3G }

  otel-collector:
    <<: *hardening
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [internal]

networks:
  edge: {}
  egress: {}
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  worker_scratch:
  whisper_models:
  clamav_db:
