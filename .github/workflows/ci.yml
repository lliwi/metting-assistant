name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: metting
          POSTGRES_PASSWORD: metting
          POSTGRES_DB: metting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metting" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://metting:metting@localhost:5432/metting_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Migraciones sin cambios pendientes
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check
      - name: Auditoría de dependencias
        run: uv export --no-dev --no-hashes --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:i18n
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Tipos de la API al día con el OpenAPI
        run: |
          ../../scripts/gen-api-types.sh
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  stack:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/generate-env.sh
      - name: Arranque con health checks
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test a través del reverse proxy
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8080/es
          curl -fsS http://127.0.0.1:8080/api/readyz
      - name: Solo nginx publica puertos
        run: |
          published=$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.ports) | .key')
          echo "Servicios con puertos publicados: $published"
          test "$published" = "nginx"
      - name: Escaneo de imágenes
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: metting-agent/api:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
