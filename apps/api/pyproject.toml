[project]
name = "metting-agent-api"
version = "0.1.0"
description = "Metting Agent — API y workers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "celery>=5.6.3",
    "fastapi>=0.158.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
