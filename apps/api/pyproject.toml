[project]
name = "metting-agent-api"
version = "0.1.0"
description = "Metting Agent — API y workers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "av<16",
    "boto3>=1.43.116",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.158.0",
    "faster-whisper>=1.2.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "openai>=3.36.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["S105", "S106"]
# ffmpeg/ffprobe se resuelven desde el PATH de la imagen del worker.
"app/media/ffmpeg.py" = ["S607"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*", "moto.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
