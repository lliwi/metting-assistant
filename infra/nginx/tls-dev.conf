# HTTPS para probar desde otros dispositivos de la red local (el micrófono del navegador
# solo funciona en contextos seguros). Certificado autofirmado: scripts/generate-dev-cert.sh
server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/app.conf;
}
