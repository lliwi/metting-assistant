# Único punto de entrada. TLS se termina aquí en producción (ver infra/nginx/tls.conf.example).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# DNS de Docker. "resolve" vuelve a resolver los nombres: si un contenedor se recrea
# con otra IP, nginx no se queda apuntando a la antigua.
resolver 127.0.0.11 valid=10s ipv6=off;

# HSTS solo cuando el visitante llegó por HTTPS a través del proxy de borde (Cloudflare envía
# X-Forwarded-Proto: https). Nunca en desarrollo (localhost o el certificado autofirmado de
# :8443): el navegador recordaría la política para ese host.
# max-age inicial de 1 día; tras comprobar que todo va por HTTPS, subirlo a 31536000 (1 año).
# Sin includeSubDomains ni preload: afectaría a otros servicios del dominio.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=86400";
}

upstream web {
    zone upstream_web 64k;
    server web:3000 resolve;
    keepalive 16;
}

upstream api {
    zone upstream_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    include /etc/nginx/snippets/app.conf;
}
