# Cuerpo común de los servidores HTTP (8080) y HTTPS de desarrollo (8443).
server_name _;
server_tokens off;

# Segmentos de audio de 30 s y bloques de importación de 8 MB.
client_max_body_size 25m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
# CSP sin nonce: cacheComponents sirve un esqueleto prerenderizado y Next necesita sus scripts
# inline ('unsafe-inline'). El resto, solo del propio origen: sin scripts ni conexiones a
# terceros (no se pueden exfiltrar datos), sin plugins y sin incrustar la app en otras webs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Correlation-ID $correlation_id;

location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}

# Métricas internas: solo para Prometheus en la red de Docker.
location = /api/metrics {
    return 404;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    # SSE: sin buffering para que los eventos lleguen al instante.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_pass http://api/;
}

location / {
    proxy_pass http://web;
}
